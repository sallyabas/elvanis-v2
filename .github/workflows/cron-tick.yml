name: Cron tick

# Real cost decision (confirmed 2026-08-07): Vercel Hobby caps cron jobs at
# once/day, so a */15 schedule (what vercel.json originally had) would fail
# at deploy time on Hobby, not just run less precisely. Staying on Vercel's
# free tier until the first 10 clients, so the frequent check runs here
# instead via GitHub Actions' own free scheduled-workflow tier — zero
# changes to the route itself, since /api/cron/tick already only checks a
# bearer token against CRON_SECRET and doesn't care who calls it. Vercel
# still runs its own once-daily cron (see vercel.json) against the same
# route as a harmless backstop in case this workflow ever silently stops
# firing.
#
# Real caveat, not hidden: GitHub Actions scheduled workflows are
# documented as "best effort" — during periods of high platform load a run
# can be delayed by several minutes, occasionally more. Acceptable here:
# the one genuinely time-sensitive check (the 24h edit-window notification)
# tolerates a few minutes of slack fine. Also documented by GitHub: a
# scheduled workflow is automatically disabled after 60 days with no
# commits to the repo — not a concern for an actively-developed repo, but
# worth knowing if this repo ever goes quiet for two months.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab, for testing

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/tick
        run: |
          curl -sf -X GET "${{ vars.SITE_URL }}/api/cron/tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
